<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#dce6ef;font:12px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:#c6d4e2;background:#1c2938;border:1px solid #344357;border-radius:5px;padding:7px 10px}button:hover{background:#304257;color:white}button.active{background:#126e85;border-color:#50c4da;color:white}button:focus-visible,input:focus-visible{outline:2px solid #70e0ff;outline-offset:2px}#app{height:640px;position:relative;border:1px solid #334255;border-radius:9px;overflow:hidden}header{height:50px;background:#152131;display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid #344255}header b{font-size:14px;letter-spacing:.3px}header small{color:#83a1b8}#badge{margin-left:auto;color:#7bd1c8;font:10px ui-monospace,monospace;border:1px solid #315960;border-radius:3px;padding:3px 6px}#toolbar{height:44px;display:flex;align-items:center;gap:5px;padding:5px 10px;background:#182434;overflow-x:auto;white-space:nowrap}#toolbar .divider{height:20px;border-left:1px solid #3b4c60;margin:0 4px}#viewport{position:absolute;inset:94px 0 91px;background:#99afbd}canvas{display:block;width:100%;height:100%;touch-action:none}aside{position:absolute;top:108px;background:#142130ed;border:1px solid #405269;box-shadow:0 6px 24px #0003;border-radius:7px;z-index:2}#layers{left:12px;width:154px;padding:12px}aside h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#87a6bf;margin:0 0 10px}label.check{display:flex;align-items:center;gap:7px;margin:8px 0;cursor:pointer}input[type=checkbox]{accent-color:#46bfd3}#inspector{right:12px;width:205px;padding:13px}#selection-name{font-size:15px;color:#f2f7fc;font-weight:700;margin:5px 0 12px}#selection-kind{color:#62c6d6;font:10px ui-monospace,monospace}dl{margin:0;display:grid;grid-template-columns:1fr 1.1fr;gap:9px 4px;font-size:11px}dt{color:#8da5bb}dd{margin:0;text-align:right;color:#eef4fa}#hint{font-size:11px;color:#9eb1c2;padding-top:12px;border-top:1px solid #354255;margin-top:12px}#section-control{padding-top:8px;border-top:1px solid #354255}input[type=range]{width:100%;accent-color:#4cc6dc}#legend{position:absolute;bottom:106px;left:182px;background:#142130e8;padding:9px 12px;max-width:calc(100% - 410px);border:1px solid #405269;border-radius:5px;z-index:2;font-size:10px}#gradient{height:6px;background:linear-gradient(90deg,#2676c7,#33bdca,#b8d75b,#f6ad40,#e34b32);border-radius:2px;margin:5px 0}#legend-scale{display:flex;justify-content:space-between;gap:18px;font-family:ui-monospace,monospace}#timebar{position:absolute;bottom:31px;left:0;right:0;height:60px;background:#162334;display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #344255}#timebar input{flex:1;min-width:50px}#clock{min-width:90px;font:12px ui-monospace,monospace;color:#6fd2e4}#readout{font-size:11px;min-width:90px;text-align:right}footer{position:absolute;bottom:0;height:31px;left:0;right:0;background:#101c2a;padding:7px 12px;color:#8ba2b8;font-size:10px;display:flex;justify-content:space-between;gap:12px;white-space:nowrap;overflow:hidden}.model-label{position:absolute;pointer-events:none;transform:translate(-50%,-100%);color:#f0f6fc;background:#172839d9;border:1px solid #607789;padding:2px 5px;font:10px ui-monospace,monospace;border-radius:3px}#labels{position:absolute;inset:0;pointer-events:none}#error{position:absolute;inset:94px 0 31px;background:#162333;z-index:10;padding:70px 30px;text-align:center;display:none}#orientation{position:absolute;bottom:108px;right:18px;color:#263c4a;font:bold 12px ui-monospace,monospace;pointer-events:none}#measure-result{position:absolute;left:50%;top:108px;transform:translateX(-50%);background:#143a45;color:#c5f7ff;border:1px solid #58bdcc;border-radius:4px;padding:6px 12px;display:none;z-index:3}
@media(max-width:720px){#layers{width:130px;padding:8px;left:7px}#inspector{width:166px;padding:9px;right:7px}#legend{left:148px;max-width:calc(100% - 330px)}header small{display:none}#readout{display:none}}@media(max-width:500px){#layers{display:none}#inspector{top:108px;width:143px}#legend{left:8px;max-width:calc(100% - 170px)}header b{font-size:12px}#badge{font-size:8px}#clock{min-width:65px}footer span:last-child{display:none}#toolbar button{padding:7px 8px}}
</style></head><body><div id="app">
<header><b>EPC / SPATIAL ENGINEERING</b><small id="subtitle"></small><span id="badge">3D MODEL · SI</span></header>
<div id="toolbar"><button data-view="iso" class="active">3D</button><button data-view="top" id="top">PLAN</button><button data-view="front" id="front">FRONT</button><span class="divider"></span><button id="fit">FIT</button><button id="edges">EDGES</button><button id="measure">MEASURE</button><button id="panels">LAYERS</button><button id="shot">PNG</button><button id="fullscreen">⛶</button></div>
<div id="viewport"><div id="labels"></div></div>
<aside id="layers"><h3 id="layers-title"></h3><div id="layer-list"></div><div id="section-control"><label for="section" id="section-title"></label><input id="section" type="range" min="5" max="100" value="100"><span id="section-value"></span></div></aside>
<aside id="inspector"><h3 id="properties-title"></h3><div id="selection-kind"></div><div id="selection-name"></div><dl id="properties"></dl><div id="hint"></div></aside>
<div id="legend"><div id="legend-title"></div><div id="gradient"></div><div id="legend-scale"></div></div>
<div id="measure-result"></div><div id="orientation">N ↑ · X EAST / Y NORTH / Z UP</div>
<div id="timebar"><button id="play">▶</button><button id="reset">↺</button><span id="clock"></span><input id="timeline" aria-label="Simulation frame" type="range" min="0" max="1" value="0"><span id="readout"></span></div>
<footer><span id="status"></span><span id="model-note"></span></footer><div id="error" role="alert"></div>
</div><script id="scene-data" type="application/json">__SCENE_DATA__</script><script>__VIEWER_BUNDLE__</script></body></html>
