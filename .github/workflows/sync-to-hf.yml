name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 수동 실행도 가능

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install report rendering dependencies
        run: |
          sudo apt-get update
          sudo xargs -a packages.txt apt-get install -y --no-install-recommends
          sudo mkdir -p /usr/local/share/fonts/hhic
          sudo cp vendor/hhic_word/fonts/*.otf /usr/local/share/fonts/hhic/
          sudo fc-cache -f
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Check Python syntax
        run: python -m compileall -q -x '(^|[/\\])(\.git|\.?venv|env|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)([/\\]|$)' .
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run offline formula and physics regression checks
        run: python tests/verify_dashboard.py --fast

  sync:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: hf-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 1단계: Secret 등록 상태 자동 진단 (값은 노출 안 함, 길이만 출력)
      - name: Diagnose secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret이 비어있거나 등록 안 됨"
            exit 1
          fi
          if [ -z "$HF_USERNAME" ]; then
            echo "::error::HF_USERNAME secret이 비어있거나 등록 안 됨"
            exit 1
          fi
          # 토큰 형식 검증 (hf_ 로 시작해야 함)
          if [[ ! "$HF_TOKEN" =~ ^hf_ ]]; then
            echo "::error::HF_TOKEN이 'hf_'로 시작하지 않음 — 토큰 값이 잘못 입력됨 (앞에 공백/따옴표 있을 수 있음)"
            exit 1
          fi
          # 길이 정상성 확인
          TOKEN_LEN=${#HF_TOKEN}
          if [ "$TOKEN_LEN" -lt 30 ] || [ "$TOKEN_LEN" -gt 80 ]; then
            echo "::error::HF_TOKEN 길이가 비정상 ($TOKEN_LEN자) — 일반적으로 37자 내외"
            exit 1
          fi
          echo "✅ HF_TOKEN: ${TOKEN_LEN}자 (값은 마스킹됨)"
          echo "✅ HF_USERNAME: $HF_USERNAME"

      # The Hub API stores fonts/templates in supported binary storage without
      # rewriting either repository's history.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hub uploader
        run: pip install huggingface_hub==1.6.0

      - name: Upload tracked deployment snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/hf-deploy"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/hf-deploy"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          folder = Path(os.environ['RUNNER_TEMP']) / 'hf-deploy'
          sha = os.environ['GITHUB_SHA']
          (folder / 'deployment.json').write_text(json.dumps({'source_commit': sha}))
          api = HfApi(token=os.environ['HF_TOKEN'])
          commit = api.upload_folder(
              repo_id='openmen-gif/bess-epc-engineering', repo_type='space',
              folder_path=folder, ignore_patterns=['.github/**'],
              commit_message=f'Deploy GitHub {sha}',
          )
          print(f'HF_COMMIT={commit.oid} SOURCE_COMMIT={sha}')
          PY
